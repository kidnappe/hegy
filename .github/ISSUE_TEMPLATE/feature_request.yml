name: 功能建议
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明「要解决什么问题」，再说明「你希望怎么做」。
        何解刻意保持无框架、无构建步骤；引入新依赖或改变架构的建议请重点说明理由。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到了什么困难？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 解题 / 提示词
        - 2D 渲染
        - 3D 渲染
        - 导出
        - 历史 / 存储
        - 桌面版
        - Android
        - UI / 皮肤
        - 文档 / 测试
        - 其他
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考链接、草图、截图等。
    validations:
      required: false
